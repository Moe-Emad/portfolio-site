# Dependabot (tracker A4).
#
# Two separate jobs:
# - Security updates (a pull request as soon as an advisory hits a locked version) are switched on in the
#   repository settings, not here. They are never delayed by the cooldown below.
# - Version updates (this file): once a week, minor and patch releases only, grouped into one pull request per
#   ecosystem, and only releases that are at least 7 days old (cooldown) - a fresh release is the usual carrier of
#   a supply-chain attack.
#
# Major versions are never proposed here: they are a decision of the owner.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # The actions of .github/workflows/gate.yml are pinned to a commit; this job proposes the new pin when a
  # release is at least 7 days old.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
