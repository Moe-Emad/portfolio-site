# Settings of the admin panel (Pages CMS, https://pagescms.org) - tracker F6.
# Do not edit this file by hand: it is written by "npm run cms-config" from tools/build/pages-cms.cjs.
# How to use the panel: docs/admin.md
media:
  input: "public/images"
  output: "/images"
content:
  - name: "profile"
    label: "Profile"
    type: "file"
    path: "content/profile.json"
    format: "json"
    fields:
      - name: "name"
        label: "Name"
        type: "string"
        required: true
      - name: "nameArabic"
        label: "Name in Arabic"
        type: "string"
        required: true
      - name: "role"
        label: "Role"
        type: "string"
        required: true
        description: "For example: Software engineer"
      - name: "location"
        label: "Country"
        type: "string"
        required: true
      - name: "headline"
        label: "Headline"
        type: "text"
        required: true
        description: "One sentence under the name on the home page."
      - name: "about"
        label: "About"
        type: "text"
        required: true
        list: true
        description: "The paragraphs of \"How I work\"."
      - name: "links"
        label: "Links"
        type: "object"
        fields:
          - name: "linkedin"
            label: "LinkedIn address"
            type: "string"
            required: true
            description: "Starts with https://"
          - name: "github"
            label: "GitHub address"
            type: "string"
            required: false
          - name: "email"
            label: "Email address"
            type: "string"
            required: false
            description: "Shown in the contact section and at the end of every project page, with a copy button."
      - name: "availability"
        label: "Availability"
        type: "string"
        required: false
        description: "One line beside the contact form: what you are open to and where you work from."
  - name: "experience"
    label: "Experience"
    type: "file"
    path: "content/experience.json"
    format: "json"
    list: true
    fields:
      - name: "id"
        label: "Short id"
        type: "string"
        required: true
        description: "Lower-case words with hyphens. Never change it once set."
      - name: "role"
        label: "Role"
        type: "string"
        required: true
      - name: "organisation"
        label: "Organisation"
        type: "string"
        required: true
      - name: "organisationNote"
        label: "What the organisation is"
        type: "string"
        required: false
      - name: "start"
        label: "Start month"
        type: "string"
        required: true
        description: "YYYY-MM, for example 2023-07"
        pattern:
          regex: "^\\d{4}-(0[1-9]|1[0-2])$"
          message: "Write the month as YYYY-MM"
      - name: "end"
        label: "End month"
        type: "string"
        required: false
        description: "YYYY-MM. Leave empty for a job that is still going."
      - name: "highlights"
        label: "What I did"
        type: "text"
        required: true
        list: true
      - name: "project"
        label: "Project on this site"
        type: "string"
        required: false
        description: "The short name of its project page, for example jpro-website. Leave empty when there is none."
  - name: "skills"
    label: "Skills"
    type: "file"
    path: "content/skills.json"
    format: "json"
    list: true
    fields:
      - name: "group"
        label: "Group"
        type: "string"
        required: true
      - name: "note"
        label: "What the group is for"
        type: "string"
        required: true
      - name: "skills"
        label: "Skills"
        type: "string"
        required: true
        list: true
        description: "Write each one exactly as in the \"Built with\" lists of the projects."
  - name: "projects"
    label: "Projects"
    type: "collection"
    path: "content/projects"
    format: "json"
    filename: "{fields.slug}.json"
    view:
      fields: ["title", "kind", "status"]
      primary: "title"
      sort: ["order"]
    fields:
      - name: "slug"
        label: "Address of the page"
        type: "string"
        required: true
        description: "Lower-case words with hyphens, like \"rental-platform\". The page is /work/<this>/."
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: "Lower-case words joined by hyphens"
      - name: "title"
        label: "Title"
        type: "string"
        required: true
      - name: "titleArabic"
        label: "Title in Arabic"
        type: "string"
        required: false
      - name: "summary"
        label: "Summary"
        type: "text"
        required: true
        description: "One line, at most 180 characters. Shown in lists and link previews."
      - name: "kind"
        label: "Kind"
        type: "select"
        required: true
        options:
          values: ["Client work", "Own product", "Modernization", "Work experience", "Earlier work"]
      - name: "year"
        label: "Year"
        type: "string"
        required: false
      - name: "status"
        label: "Status"
        type: "select"
        required: true
        options:
          values: ["Live", "In progress", "Finished", "Prototype"]
      - name: "featured"
        label: "Show with a picture on the home page"
        type: "boolean"
      - name: "draft"
        label: "Draft: hide it from the whole site"
        type: "boolean"
        description: "The file is kept. Switch it off to show the project again."
      - name: "order"
        label: "Position in the list"
        type: "number"
        required: true
        description: "Low numbers come first."
      - name: "role"
        label: "My part"
        type: "text"
        required: true
      - name: "stack"
        label: "Built with"
        type: "string"
        required: true
        list: true
      - name: "description"
        label: "What it is"
        type: "text"
        required: true
        list: true
        description: "One entry per paragraph."
      - name: "highlights"
        label: "Worth a closer look"
        type: "object"
        list: true
        fields:
          - name: "title"
            label: "Title"
            type: "string"
            required: true
          - name: "text"
            label: "Text"
            type: "text"
            required: true
      - name: "facts"
        label: "Measured facts"
        type: "object"
        list: true
        description: "Only figures that were counted. Never an estimate."
        fields:
          - name: "value"
            label: "Figure"
            type: "string"
            required: true
          - name: "label"
            label: "What it counts"
            type: "string"
            required: true
      - name: "images"
        label: "Pictures"
        type: "object"
        list: true
        description: "The first picture is the cover. After adding pictures, run \"npm run pictures\" to fill in their sizes."
        fields:
          - name: "src"
            label: "Picture"
            type: "image"
            required: true
          - name: "alt"
            label: "What the picture shows"
            type: "text"
            required: true
            description: "For people who cannot see it."
          - name: "caption"
            label: "Caption"
            type: "string"
            required: false
          - name: "device"
            label: "Taken on"
            type: "select"
            required: true
            options:
              values: ["desktop", "phone"]
          - name: "width"
            label: "Width in pixels"
            type: "number"
          - name: "height"
            label: "Height in pixels"
            type: "number"
          - name: "before"
            label: "The same screen before the rework"
            type: "object"
            required: false
            description: "Optional, wide screens only, of the same shape: the page shows both with a handle to compare them. Run \"npm run pictures\" afterwards."
            fields:
              - name: "src"
                label: "Picture"
                type: "image"
                required: true
              - name: "alt"
                label: "What the picture shows"
                type: "text"
                required: true
                description: "For people who cannot see it."
              - name: "width"
                label: "Width in pixels"
                type: "number"
              - name: "height"
                label: "Height in pixels"
                type: "number"
      - name: "links"
        label: "Links"
        type: "object"
        fields:
          - name: "live"
            label: "Address of the live site"
            type: "string"
            required: false
          - name: "liveLabel"
            label: "Text of the button"
            type: "string"
            required: false
  - name: "archive"
    label: "Smaller and earlier work"
    type: "file"
    path: "content/archive.json"
    format: "json"
    list: true
    fields:
      - name: "title"
        label: "Title"
        type: "string"
        required: true
      - name: "tech"
        label: "Built with"
        type: "string"
        required: true
      - name: "summary"
        label: "Summary"
        type: "string"
        required: true
